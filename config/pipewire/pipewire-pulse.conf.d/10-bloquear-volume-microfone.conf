# Impede que os apps abaixo mudem sozinhos o volume do microfone
# ("ajuste automático de ganho"). Eles continuam usando o microfone normalmente.
# Este arquivo é editado pelo app "Bloqueio do microfone".
pulse.rules = [
    {
        matches = [
            { application.process.binary = "vivaldi-bin" }   # Vivaldi
            { application.process.binary = "~(chrome|chromium|brave|electron).*" }   # Chrome, Chromium, Brave e apps Electron
            { application.process.binary = "claude-desktop" }   # claude-desktop
        ]
        actions = { quirks = [ block-source-volume ] }
    }
]
