# Gerado pelo item "Áudio: escolher as saídas" do gnome-config.
# Para mudar, rode o ./install.sh de novo e escolha esse item.
# Para desfazer, apague este arquivo e rode: systemctl --user restart wireplumber
# manter: alsa_card.pci-0000_0d_00.4:analog
# manter: alsa_card.usb-Kingston_HyperX_Cloud_Revolver_S_000000000000-00:analog
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_0b_00.1" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { device.name = "alsa_card.usb-Kingston_HyperX_Cloud_Revolver_S_000000000000-00" }
      { device.name = "alsa_card.pci-0000_0d_00.4" }
    ]
    actions = {
      update-props = {
        device.profile-set = "analog-only.conf"
      }
    }
  }
]
