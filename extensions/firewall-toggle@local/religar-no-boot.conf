# Faz o firewall (ufw) SEMPRE iniciar ligado, mesmo que tenha sido
# desligado antes de reiniciar (por exemplo, pelo "Botão do firewall").
# Instalado em /etc/systemd/system/ufw.service.d/ pelo gnome-config.
[Unit]
# Garante que o disco já está gravável antes de mexer no ufw.conf
After=systemd-remount-fs.service

[Service]
# O "-" no começo: se der erro, o ufw sobe mesmo assim com a configuração anterior
ExecStartPre=-/usr/bin/sed -i -E 's/^ENABLED=.*/ENABLED=yes/' /etc/ufw/ufw.conf
